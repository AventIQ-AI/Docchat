# ─────────────────────────────────────────────────────────────────────────────
# Docker Compose: Complete Local & Cloud Production Stack
# Includes:
#   1. postgres: PostgreSQL 16 + pgvector
#   2. ollama: Local Ollama LLM server (persistent models volume)
#   3. ollama_puller: One-shot service to auto-download qwen3 models
#   4. api: FastAPI RAG Web API (Port 8000)
#
# Usage:
#   docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ollama_rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ollama_rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_user} -d ${POSTGRES_DB:-ollama_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_rag_ollama
    restart: unless-stopped
    volumes:
      - C:/Users/ShubhamKumar/.ollama:/root/.ollama
    # GPU support (uncomment if using Azure GPU VM like NC6s_v3)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama_puller:
    image: ollama/ollama:latest
    container_name: ollama_rag_model_puller
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        echo "Waiting for Ollama to be ready..."
        sleep 5
        echo "Pulling embedding model: qwen3-embedding:0.6b"
        ollama pull qwen3-embedding:0.6b
        echo "Pulling chat model: qwen2.5:1.5b"
        ollama pull qwen2.5:1.5b
        echo "Models ready!"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ollama_rag_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ollama_rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:1.5b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-qwen3-embedding:0.6b}
      DOCUMENTS_FOLDER: ./documents
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
      API_KEY: "${API_KEY:-}"
    volumes:
      - ./documents:/app/documents
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  pgdata:
    driver: local
  ollama_data:
    driver: local
